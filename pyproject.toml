[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcptap"
version = "0.3.0"
description = "A zero-dependency wire tap for MCP stdio servers: record, replay, and report on the traffic between your MCP client and servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mcptap contributors" }]
keywords = ["mcp", "model-context-protocol", "observability", "debugging", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.scripts]
mcptap = "mcptap.cli:main"

[tool.setuptools.packages.find]
include = ["mcptap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
